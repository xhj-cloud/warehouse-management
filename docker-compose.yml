# ============================================
#  仓库管理系统 - Docker Compose 配置
#  使用方式:
#    1. cp .env.example .env   # 并填写 DB_PASSWORD / MYSQL_ROOT_PASSWORD / AUTH_PASSWORD
#    2. docker compose up -d
#  密码一律从项目目录的 .env 读取（本文件不内置任何默认密码）
# ============================================

version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: warehouse-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD（MySQL root 密码）}
      MYSQL_DATABASE: warehouse_db
      MYSQL_USER: warehouse
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD（应用数据库密码）}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Flask 应用
  app:
    build: .
    container_name: warehouse-app
    restart: always
    ports:
      - "5050:5050"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: warehouse
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD（应用数据库密码）}
      DB_NAME: warehouse_db
      LM_STUDIO_URL: http://127.0.0.1:1234/v1
      # 管理员初始密码：首次启动 users 表为空时用它创建 admin；留空则自动生成随机密码并打印到日志
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
